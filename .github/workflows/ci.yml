name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check JSON syntax
        run: |
          find . -path ./.git -prune -o -name '*.json' -type f -print0 \
            | xargs -0 -n1 jq empty
      # Image versions are bumped by hand (Dependabot does not see them).
      - name: shellcheck
        run: |
          git ls-files -z '*.sh' \
            | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -x -S warning
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  validate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate devcontainer-feature.json files
        uses: devcontainers/action@v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: ./src

  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      features: ${{ steps.list.outputs.features }}
      host_features: ${{ steps.list.outputs.host_features }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List features to test
        id: list
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          all=$(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [ "$EVENT" = "pull_request" ]; then
            selected=""
            all_needed=false
            while IFS= read -r file; do
              case "$file" in
                src/*/*|test/*/*)
                  selected+="$(echo "$file" | cut -d/ -f2)"$'\n' ;;
                docs/*) ;;
                # Release metadata, no feature code. A release PR still
                # selects its feature through src/<id>/CHANGELOG.md.
                .release-please-manifest.json|release-please-config.json) ;;
                */*) all_needed=true ;;
                *.md) ;;
                *) all_needed=true ;;
              esac
            done < <(git diff --name-only "$BASE_SHA"...HEAD)
            if [ "$all_needed" = true ]; then
              selected="$all"
            fi
            # keep only ids that still exist under src/
            selected=$(printf '%s\n' "$selected" | sort -u | grep -Fxf <(printf '%s\n' "$all") || true)
          else
            selected="$all"
          fi
          features=$(printf '%s\n' "$selected" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "features=$features" >> "$GITHUB_OUTPUT"
          echo "Features to test: $features"
          # Features with host-side tests (test/<id>/host/run.sh).
          host_features=$(jq -r '.[]' <<<"$features" \
            | while read -r f; do if [ -f "test/$f/host/run.sh" ]; then echo "$f"; fi; done \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "host_features=$host_features" >> "$GITHUB_OUTPUT"
          echo "Features with host tests: $host_features"

  default:
    name: default (${{ matrix.feature }}, ${{ matrix.image }}, ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'amd64' }})
    needs: changes
    if: needs.changes.outputs.features != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.changes.outputs.features) }}
        image: ["debian:trixie", "debian:bookworm", "ubuntu:26.04", "ubuntu:24.04"]
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        exclude:
          # Upstream arm64 binary needs glibc >= 2.38; bookworm ships 2.36.
          - feature: lightpanda
            image: debian:bookworm
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - name: Test feature
        env:
          FEATURE: ${{ matrix.feature }}
          IMAGE: ${{ matrix.image }}
        run: npx --yes @devcontainers/cli@0.90.0 features test --skip-scenarios -f "$FEATURE" -i "$IMAGE" .

  scenarios:
    name: scenarios (${{ matrix.feature }}, ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'amd64' }})
    needs: changes
    if: needs.changes.outputs.features != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.changes.outputs.features) }}
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - name: Test scenarios
        env:
          FEATURE: ${{ matrix.feature }}
        run: npx --yes @devcontainers/cli@0.90.0 features test -f "$FEATURE" --skip-autogenerated --skip-duplicated .

  # Pure-shell unit tests (no Docker, no network) of every changed feature
  # that has test/<id>/unit/run.sh.
  unit:
    needs: changes
    if: needs.changes.outputs.features != '[]'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run unit tests
        env:
          FEATURES: ${{ needs.changes.outputs.features }}
        run: |
          rc=0
          for feature in $(jq -r '.[]' <<<"$FEATURES"); do
            if [ -x "test/$feature/unit/run.sh" ]; then
              echo "::group::$feature"
              "test/$feature/unit/run.sh" || rc=1
              echo "::endgroup::"
            else
              echo "$feature: no unit tests"
            fi
          done
          exit "$rc"

  # Host-side tests (Docker and the devcontainer CLI on the runner, e.g.
  # expected build failures, rebuilds) of every changed feature that has
  # test/<id>/host/run.sh. The script knows its own images and cases.
  host:
    name: host (${{ matrix.feature }}, ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'amd64' }})
    needs: changes
    if: needs.changes.outputs.host_features != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.changes.outputs.host_features) }}
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli@0.90.0
      - name: Host tests
        env:
          FEATURE: ${{ matrix.feature }}
        run: |
          "test/$FEATURE/host/run.sh"

  test:
    needs: [changes, default, scenarios, unit, host]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")'
