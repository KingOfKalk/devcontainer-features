name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check JSON syntax
        run: |
          find . -path ./.git -prune -o -name '*.json' -type f -print0 \
            | xargs -0 -n1 jq empty

  validate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate devcontainer-feature.json files
        uses: devcontainers/action@v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: ./src

  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      features: ${{ steps.list.outputs.features }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List features to test
        id: list
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          all=$(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [ "$EVENT" = "pull_request" ]; then
            selected=""
            all_needed=false
            while IFS= read -r file; do
              case "$file" in
                src/*/*|test/*/*)
                  selected+="$(echo "$file" | cut -d/ -f2)"$'\n' ;;
                docs/*) ;;
                # Release metadata, no feature code. A release PR still
                # selects its feature through src/<id>/CHANGELOG.md.
                .release-please-manifest.json|release-please-config.json) ;;
                */*) all_needed=true ;;
                *.md) ;;
                *) all_needed=true ;;
              esac
            done < <(git diff --name-only "$BASE_SHA"...HEAD)
            if [ "$all_needed" = true ]; then
              selected="$all"
            fi
            # keep only ids that still exist under src/
            selected=$(printf '%s\n' "$selected" | sort -u | grep -Fxf <(printf '%s\n' "$all") || true)
          else
            selected="$all"
          fi
          features=$(printf '%s\n' "$selected" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "features=$features" >> "$GITHUB_OUTPUT"
          echo "Features to test: $features"

  default:
    name: default (${{ matrix.feature }}, ${{ matrix.image }}, ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'amd64' }})
    needs: changes
    if: needs.changes.outputs.features != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.changes.outputs.features) }}
        image: ["debian:trixie", "debian:bookworm", "ubuntu:26.04", "ubuntu:24.04"]
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        exclude:
          # Upstream arm64 binary needs glibc >= 2.38; bookworm ships 2.36.
          - feature: lightpanda
            image: debian:bookworm
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - name: Test feature
        env:
          FEATURE: ${{ matrix.feature }}
          IMAGE: ${{ matrix.image }}
        run: npx --yes @devcontainers/cli@0.90.0 features test --skip-scenarios -f "$FEATURE" -i "$IMAGE" .

  scenarios:
    name: scenarios (${{ matrix.feature }}, ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'amd64' }})
    needs: changes
    if: needs.changes.outputs.features != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.changes.outputs.features) }}
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - name: Test scenarios
        env:
          FEATURE: ${{ matrix.feature }}
        run: npx --yes @devcontainers/cli@0.90.0 features test -f "$FEATURE" --skip-autogenerated --skip-duplicated .

  home-persistence-validation:
    name: home-persistence validation (${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'amd64' }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.features), 'home-persistence')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Invalid options fail the build
        run: test/home-persistence/host/validation.sh debian:trixie ubuntu:26.04 alpine:3.24

  home-persistence-rebuild:
    name: home-persistence rebuild (${{ matrix.target.image }}, ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'amd64' }})
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.features), 'home-persistence')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        target:
          - { image: "mcr.microsoft.com/devcontainers/base:debian", user: vscode, remoteUser: "" }
          - { image: "mcr.microsoft.com/devcontainers/javascript-node:24", user: node, remoteUser: "" }
          - { image: "node:24", user: node, remoteUser: node }
          - { image: "mcr.microsoft.com/devcontainers/base:alpine", user: vscode, remoteUser: "" }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli@0.90.0
      - name: Data survives restart and rebuild
        env:
          IMAGE: ${{ matrix.target.image }}
          EXPECTED_USER: ${{ matrix.target.user }}
          REMOTE_USER: ${{ matrix.target.remoteUser }}
        run: test/home-persistence/host/rebuild.sh "$IMAGE" "$EXPECTED_USER" "$REMOTE_USER"

  test:
    needs: [changes, default, scenarios, home-persistence-validation, home-persistence-rebuild]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")'
